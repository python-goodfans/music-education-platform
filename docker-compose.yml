version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: music_edu_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: music_education
      MYSQL_USER: music_user
      MYSQL_PASSWORD: music_password123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - music_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Django Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: music_edu_backend
    restart: always
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DEBUG: "False"
      DATABASE_URL: mysql://music_user:music_password123@db:3306/music_education
      DJANGO_SETTINGS_MODULE: music_platform.settings
    depends_on:
      db:
        condition: service_healthy
    networks:
      - music_network

  # Vue.js Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: music_edu_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - music_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: music_edu_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - music_network

# Named Volumes
volumes:
  db_data:
    driver: local

# Networks
networks:
  music_network:
    driver: bridge
