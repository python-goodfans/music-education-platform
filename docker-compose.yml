version: '3.8'\n\nservices:\n  db:\n    image: mysql:5.7\n    volumes:\n      - db_data:/var/lib/mysql\n    environment:\n      MYSQL_DATABASE: 'music_education'\n      MYSQL_USER: 'user'\n      MYSQL_PASSWORD: 'password'\n      MYSQL_ROOT_PASSWORD: 'root_password'\n\n  backend:\n    build: ./backend\n    volumes:\n      - ./backend:/app\n    ports:\n      - '8000:8000'\n    environment:\n      DATABASE_URL: 'mysql://user:password@db/music_education'\n\n  frontend:\n    build: ./frontend\n    volumes:\n      - ./frontend:/app\n    ports:\n      - '8080:8080'\n\nvolumes:\n  db_data: